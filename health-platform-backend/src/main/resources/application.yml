#web端口号
server:
  port: 8080
  servlet:
    context-path: /health_platform
# 默认激活 local profile：本地开发读取同目录的 application-local.yml（已加入 .gitignore，不入库）。
# 该文件不存在时（如 CI 或他人克隆后首次运行），自动回退到下面的默认值。
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://localhost:3306/health_platform?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
#mybatis-plus的小驼峰设置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
# JWT配置（登录令牌）
jwt:
  secret: ${JWT_SECRET:health-platform-secret-key-2026-dlnu}   # HS256 要求至少 32 字节；生产环境务必通过环境变量覆盖
  expiration: 86400000    # 24小时，单位毫秒

# 高德地图Web服务Key（逆地理编码用，注意是顶层配置，不能缩进到 jwt 下）
# 默认留空：真实 Key 只放在 application-local.yml 或环境变量 AMAP_WEB_SERVICE_KEY 中，绝不入库
amap:
  web-service-key: ${AMAP_WEB_SERVICE_KEY:}